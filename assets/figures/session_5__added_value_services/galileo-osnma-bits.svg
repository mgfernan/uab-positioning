  <title
     id="title">Galileo E1-B navigation message structure</title>
  <desc
     id="desc">Two message layouts. Envelope ID 1 contains page type, Data j (2/2), OSNMA, SAR, spare, CRC, SSP, and Tail fields. Envelope ID 0 contains page type, Data k (1/2), and Tail. Both total 120 bits.</desc>
